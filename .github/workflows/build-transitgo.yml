# Builds the Transit GO plugin APK on GitHub.
# Run it from the Actions tab ("Build Transit GO plugin" > Run workflow), then download the
# "transitgo-plugin" artifact from the finished run.
name: Build Transit GO plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'transitgo/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/build-transitgo.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :transitgo:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: transitgo-plugin
          path: |
            apks/*.apk
            transitgo/build/outputs/apk/**/*.apk
          if-no-files-found: error
