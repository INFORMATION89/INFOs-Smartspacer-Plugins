plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'dev.marco.smartspacer.transitgo'
    compileSdk compile_sdk

    defaultConfig {
        applicationId "dev.marco.smartspacer.transitgo"
        minSdk min_sdk
        targetSdk target_sdk
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs rootProject.ext.signingConfigs

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.each { output ->
            output.outputFileName = new File(outputFileDir, "transitgo-${variant.name}.apk")
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    // Standalone: no :shared. Settings screen uses Compose + Material 3 Expressive
    implementation 'com.kieronquinn.smartspacer:sdk-plugin:1.1.2'
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation platform('androidx.compose:compose-bom:2025.10.00')
    implementation 'androidx.compose.material3:material3:1.5.0-rc01'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.11.0'
}
